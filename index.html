<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NUESTRO OPERADOR · Ordem de Serviço</title>
<meta name="theme-color" content="#0b3d2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --font-display: 'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body: 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono: 'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --bg:#e9eee8; --surface:#fafbf9; --ink:#15211b; --muted:#56675d; --line:#cfd8ce;
  --accent:#0b3d2e; --on-accent:#fff;
  --signal:#f5b800; --on-signal:#1c1700;
  --ok:#12543d; --ok-bg:#d9eee1; --nl:#8a5a00; --nl-bg:#fbefc7; --bad:#a8231b; --bad-bg:#f8dad7;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#0f1612; --surface:#172019; --ink:#e8efe9; --muted:#98a99e; --line:#2a372e;
    --accent:#4cc38a; --on-accent:#06150d;
    --ok:#6fd6a3; --ok-bg:#1d3a2b; --nl:#f2c14e; --nl-bg:#3a3112; --bad:#ff8a80; --bad-bg:#3d1f1c;
    color-scheme: dark; }
}
*,*::before,*::after { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.4; margin:0;
  padding-left:max(14px,env(safe-area-inset-left,0px)); padding-right:max(14px,env(safe-area-inset-right,0px)); }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--bg); z-index:10; }
button,input { font-family:inherit; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
.app { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; padding-bottom:40px; }

/* topo */
.top { position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--line);
  padding-block:10px 8px; display:flex; flex-direction:column; gap:7px; }
.top-row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
.ordem { font-family:var(--font-display); font-weight:700; font-size:22px; line-height:1; }
.frota { font-size:13px; color:var(--muted); }
.cnt { font-family:var(--font-display); font-size:15px; color:var(--muted); white-space:nowrap; text-align:right; }
.cnt strong { font-size:26px; color:var(--ink); display:block; line-height:1; font-variant-numeric:tabular-nums; }
.bar { height:7px; background:var(--line); border-radius:4px; overflow:hidden; }
.bar i { display:block; height:100%; width:0; background:var(--accent); }
@media (prefers-reduced-motion:no-preference) { .bar i { transition:width .3s ease; } }

/* aviso */
.aviso { background:var(--bad-bg); color:var(--bad); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:10px; }
.aviso b { font-family:var(--font-display); font-size:20px; }
.aviso p { margin:0; font-size:15px; }
.wv { background:var(--bad-bg); color:var(--bad); border-radius:10px; padding:12px; margin-top:10px; font-size:14px; }

/* cartão da parada em foco */
.foco { background:var(--signal); color:var(--on-signal); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:14px; }
.foco .eyebrow { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; }
.foco h1 { font-family:var(--font-display); font-weight:700; font-size:clamp(30px,8.5vw,42px); line-height:1.03; margin:0; overflow-wrap:anywhere; }
.pedidos { display:flex; flex-direction:column; gap:10px; }
.ped { border-left:4px solid var(--on-signal); padding-left:10px; }
.ped-head { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13px; font-weight:600; }
.ped p { margin:2px 0 0; font-size:16px; }
.ped .obs { font-weight:700; }
.btn { min-height:60px; padding:0 18px; border-radius:11px; border:3px solid transparent; font-size:19px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:8px; text-decoration:none; cursor:pointer; text-align:center; width:100%; }
.btn-maps { background:var(--on-signal); color:var(--signal); }

/* respostas */
.resp { display:flex; flex-direction:column; gap:10px; }
.resp button { min-height:74px; border-radius:11px; border:3px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:20px; font-weight:700; cursor:pointer; display:flex; align-items:center; gap:14px; padding:0 18px; text-align:left; }
.resp .gl { font-size:30px; line-height:1; width:36px; text-align:center; }
.resp button[data-r="S"]  { border-color:var(--ok); }
.resp button[data-r="NL"] { border-color:var(--nl); }
.resp button[data-r="N"]  { border-color:var(--bad); }

/* motivos */
.motivos { background:var(--surface); border:3px solid var(--bad); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
.motivos h2 { font-family:var(--font-display); font-size:21px; margin:0; color:var(--bad); }
.mgrupo { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:6px 0 0; }
.mlista { display:flex; flex-direction:column; gap:7px; }
.mlista button { min-height:56px; padding:0 16px; border-radius:9px; border:2px solid var(--line); background:var(--bg);
  color:var(--ink); font-size:18px; font-weight:600; text-align:left; cursor:pointer; }
.volta { min-height:52px; border-radius:9px; border:2px solid var(--line); background:transparent; color:var(--muted);
  font-size:16px; font-weight:600; cursor:pointer; width:100%; }

/* foto */
.fotobox { background:var(--surface); border:3px solid var(--nl); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
.fotobox h2 { font-family:var(--font-display); font-size:21px; margin:0; }
.fotobox img { width:100%; border-radius:8px; display:block; }
.btn-foto { background:var(--nl-bg); color:var(--nl); border:3px solid var(--nl); }
.btn-ok { background:var(--accent); color:var(--on-accent); }

/* lista */
.lista { display:flex; flex-direction:column; gap:8px; }
.lin { display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; align-items:center; width:100%;
  padding:13px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:16px; text-align:left; cursor:pointer; min-height:62px; }
.lin.feita { background:var(--signal); color:var(--on-signal); border-color:var(--signal); }
.lin .num { font-family:var(--font-mono); font-size:15px; font-variant-numeric:tabular-nums; opacity:.75; }
.lin .end { font-family:var(--font-display); font-weight:600; font-size:18px; line-height:1.15; overflow-wrap:anywhere; }
.lin .st { font-size:14px; font-weight:600; }
.sec-h { font-family:var(--font-display); font-size:24px; margin:4px 0 0; }

/* conferir / enviado */
.painel { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:18px; display:flex; flex-direction:column; gap:14px; }
.painel h1 { font-family:var(--font-display); font-size:26px; margin:0; }
.linhas { display:flex; flex-direction:column; gap:8px; font-size:18px; }
.linhas div { display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); padding-bottom:6px; }
.linhas b { font-variant-numeric:tabular-nums; }
.alerta { background:var(--bad-bg); color:var(--bad); border-radius:9px; padding:12px; font-weight:700; font-size:17px; }
.okbox { background:var(--ok-bg); color:var(--ok); border-radius:12px; padding:22px; text-align:center; display:flex; flex-direction:column; gap:8px; }
.okbox .big { font-family:var(--font-display); font-size:34px; font-weight:700; line-height:1; }
.hint { margin:0; font-size:15px; color:var(--muted); }
.mini { background:transparent; border:0; color:var(--muted); font-size:14px; text-decoration:underline; cursor:pointer; padding:10px 0; }
.foot { font-size:12px; color:var(--muted); text-align:center; }
.toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--bg);
  padding:13px 20px; border-radius:24px; font-weight:600; font-size:16px; z-index:50; max-width:92vw; text-align:center; }
.hero { margin-top:24px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:12px; }
.hero h1 { font-family:var(--font-display); font-size:28px; margin:0; }
</style>
</head>
<body>
<div id="root" class="app"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<script src="ordem.js"></script>
<script>
(function () {
  'use strict';
  var VERSAO = '0.3.0';

  var MOTIVOS = [
    ['Impedimento', ['Grande Quantidade','Dentro do Imóvel','Carro Obstruindo','Endereço não Encontrado','Morador de rua no local','Aterro']],
    ['Material não aceito', ['Tronco de Árvore','Areia, Terra, Pedra','Blocos de Concreto','Fibra de Vidro','Gesso, Drywall']]
  ];
  var COM_FOTO = 'Grande Quantidade';
  var NOME = { S:'Coletado', NL:'Nada no local', N:'Não Coletado' };
  var GLIFO = { S:'✓', NL:'○', N:'✕' };

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function pad(n){ return n<10?'0'+n:String(n); }
  function hhmm(iso){ try{var d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes());}catch(e){return '--:--';} }
  function dataBR(iso){ try{var d=new Date(iso);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}catch(e){return '';} }
  function title(a){ var s={de:1,do:1,da:1,dos:1,das:1,e:1};
    return String(a).toLowerCase().split(' ').map(function(w,i){return (i>0&&s[w])?w:w.charAt(0).toUpperCase()+w.slice(1);}).join(' '); }
  function toast(m){ var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m;
    document.body.appendChild(t); setTimeout(function(){t.remove();},3200); }
  function isWebView(){ var ua=navigator.userAgent||'';
    return /\bwv\b/.test(ua) || /(FBAN|FBAV|Instagram|Line\/)/.test(ua) || (/iPhone|iPad/.test(ua) && !/Safari/.test(ua)); }

  /* ---------- fotos em IndexedDB ---------- */
  var DB=null;
  function db(){
    if (DB) return Promise.resolve(DB);
    return new Promise(function(ok,err){
      var r = indexedDB.open('nuestro-operador-fotos',1);
      r.onupgradeneeded=function(){ r.result.createObjectStore('f'); };
      r.onsuccess=function(){ DB=r.result; ok(DB); };
      r.onerror=function(){ err(r.error); };
    });
  }
  function fotoSalvar(k,dataUrl){
    return db().then(function(d){ return new Promise(function(ok,err){
      var t=d.transaction('f','readwrite'); t.objectStore('f').put(dataUrl,k);
      t.oncomplete=function(){ok();}; t.onerror=function(){err(t.error);};
    });});
  }
  function fotoLer(k){
    return db().then(function(d){ return new Promise(function(ok){
      var q=d.transaction('f','readonly').objectStore('f').get(k);
      q.onsuccess=function(){ok(q.result||null);}; q.onerror=function(){ok(null);};
    });}).catch(function(){ return null; });
  }

  /* ---------- estado ---------- */
  var O=null, paradas=[], KEY='';
  var S={ res:{}, motivo:{}, horas:{}, fotos:{}, foco:0, view:'foco',
          enviado:null, log:[], saiuPara:null, saiuEm:null, aviso:null };

  function save(){
    try{
      var c={}; Object.keys(S).forEach(function(k){ if(k!=='previa') c[k]=S[k]; });
      localStorage.setItem(KEY, JSON.stringify(c));   /* a prévia da foto é pesada: fica só na memória */
    }catch(e){}
  }
  function carregar(){ try{ var r=localStorage.getItem(KEY); if(!r) return;
      var o=JSON.parse(r); Object.keys(S).forEach(function(k){ if(o[k]!=null) S[k]=o[k]; });
      if(!S.log) S.log=[]; S.view = S.enviado ? 'enviado' : 'foco'; S.aviso=null;
    }catch(e){} }
  function logar(m){ S.log.push({t:new Date().toISOString(),m:m}); }

  function montar(ord){
    O=ord; KEY='nuestro-operador:'+(O.ordem||'sem-numero');
    var loc=[O.bairro,O.cidade].filter(Boolean).join(', ');
    var brutas=[];
    if (O.paradas && O.paradas.length) {
      brutas = O.paradas.map(function(p,i){ return { n:p.n||(i+1), e:p.e||'', itens:p.i||p.itens||[], o:p.o||'' }; });
    } else if (O.itens && O.itens.length) {
      var by={};
      O.itens.forEach(function(it){
        var k=String(it.e).toLowerCase().trim(), g=by[k];
        if(!g){ g=by[k]={n:brutas.length+1,e:it.e,itens:[],o:''}; brutas.push(g); }
        g.itens.push(it);
      });
    }
    paradas = brutas.map(function(b,i){
      var end=String(b.e||''); if(end===end.toUpperCase() && /[A-Z]/.test(end)) end=title(end);
      return { key:'p'+(i+1), n:b.n||(i+1), e:end, obs:b.o||'',
        itens:(b.itens||[]).map(function(x){ return {p:String(x.p||''),dt:x.dt||x.data||'',d:x.d||'',o:x.o||''}; }),
        maps:'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(end+(loc?', '+loc:''))+'&travelmode=driving' };
    });
    carregar();
    if(!S.log.length) logar('Ordem aberta no aparelho');
    S.foco = Math.max(0, indicePendente());
    save();
  }

  function respondida(p){ var r=S.res[p.key]; return r==='S'||r==='NL'||(r==='N'&&!!S.motivo[p.key]); }
  function indicePendente(){ for(var i=0;i<paradas.length;i++) if(!respondida(paradas[i])) return i; return paradas.length-1; }
  function faltam(){ return paradas.filter(function(p){return !respondida(p);}).length; }
  function contagem(){ var c={S:0,NL:0,N:0};
    paradas.forEach(function(p){ if(respondida(p)) c[S.res[p.key]]++; }); return c; }
  function comFoto(){ return paradas.filter(function(p){ return S.fotos[p.key]; }); }
  function travado(){ return !!S.enviado; }

  /* ---------- telas ---------- */
  function telaInicial(msg){
    $('root').innerHTML='<div class="hero"><div class="frota">NUESTRO OPERADOR</div>'+
      '<h1>'+(msg?'Não foi possível abrir a ordem':'Ordem de Serviço')+'</h1>'+
      '<p>'+(msg?esc(msg):'Aponte a câmera no QR da folha ou toque no link que você recebeu.')+'</p>'+
      '<p class="foot">versão '+VERSAO+'</p></div>';
  }

  function topo(){
    var feitas=paradas.length-faltam();
    return '<header class="top"><div class="top-row"><div>'+
      '<div class="ordem">'+esc(O.ordem||'—')+'</div>'+
      '<div class="frota">'+[O.frota?'Frota '+esc(O.frota):'',esc(O.bairro||'')].filter(Boolean).join(' · ')+'</div></div>'+
      '<div class="cnt"><strong>'+feitas+'</strong>de '+paradas.length+'</div></div>'+
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+paradas.length+'" aria-valuenow="'+feitas+'">'+
      '<i style="width:'+(paradas.length?feitas/paradas.length*100:0)+'%"></i></div></header>';
  }

  function render(){
    if (S.view==='enviado') return renderEnviado();
    if (S.view==='conferir') return renderConferir();
    if (S.view==='lista') return renderLista();
    renderFoco();
  }

  function renderFoco(){
    var p = paradas[S.foco]; if(!p){ S.foco=0; p=paradas[0]; }
    var r = S.res[p.key], mot = S.motivo[p.key];
    var h = '';
    if (isWebView()) h += '<div class="wv"><b>▲ Abra no Chrome.</b> No navegador do WhatsApp o que você marcar pode sumir.</div>';
    h += topo();

    if (S.aviso) {
      h += '<div class="aviso"><b>▲ Parada '+S.aviso.n+' sem resposta</b>'+
        '<p>Você abriu o mapa de <strong>'+esc(S.aviso.e)+'</strong> e não marcou o resultado.</p>'+
        '<button type="button" class="btn btn-maps" data-act="ir-aviso">Marcar agora</button></div>';
    }

    /* mostrando os motivos */
    if (r==='N' && !mot) {
      h += '<div class="motivos"><h2>Por que não coletou?</h2>'+
        MOTIVOS.map(function(g){
          return '<p class="mgrupo">'+g[0]+'</p><div class="mlista">'+
            g[1].map(function(m){ return '<button type="button" data-act="motivo" data-m="'+esc(m)+'">'+esc(m)+'</button>'; }).join('')+
          '</div>';
        }).join('')+
        '<button type="button" class="volta" data-act="limpar">voltar</button></div>';
      $('root').innerHTML=h; return;
    }

    /* pedindo a foto */
    if (r==='N' && mot===COM_FOTO && S.pendenteFoto) {
      h += '<div class="fotobox"><h2>Foto da pilha</h2>'+
        (S.previa ? '<img src="'+S.previa+'" alt="foto da parada">' : '<p class="hint">Grande Quantidade pede foto. Tire uma foto mostrando o volume.</p>')+
        '<button type="button" class="btn btn-foto" data-act="foto">'+(S.previa?'Tirar outra':'Tirar foto')+'</button>'+
        '<button type="button" class="btn btn-ok" data-act="foto-ok">'+(S.previa?'Pronto':'Seguir sem foto')+'</button></div>';
      $('root').innerHTML=h; return;
    }

    h += '<section class="foco">'+
      '<div class="eyebrow">Parada '+p.n+' de '+paradas.length+'</div>'+
      '<h1>'+esc(p.e)+'</h1>';
    if (p.itens.length) {
      h += '<div class="pedidos">'+p.itens.map(function(i){
        return '<div class="ped"><div class="ped-head">'+esc(i.p)+(i.dt?' · '+esc(i.dt):'')+'</div>'+
          (i.d?'<p>'+esc(i.d)+'</p>':'')+(i.o?'<p class="obs">● '+esc(i.o)+'</p>':'')+'</div>';
      }).join('')+'</div>';
    }
    if (p.obs) h += '<div class="ped"><p class="obs">● '+esc(p.obs)+'</p></div>';
    h += '<a class="btn btn-maps" href="'+esc(p.maps)+'" target="_blank" rel="noopener" data-act="maps" data-k="'+p.key+'">Abrir no Google Maps ↗</a>'+
      '</section>';

    if (travado()) {
      h += '<div class="painel"><p class="hint">Ordem enviada. Não dá mais para mudar.</p>'+
        '<button type="button" class="btn btn-ok" data-act="ver-enviado">Voltar</button></div>';
    } else if (r) {
      h += '<div class="painel"><div class="linhas"><div><span>'+GLIFO[r]+' '+NOME[r]+(mot?' - '+esc(mot):'')+'</span>'+
        '<b>'+hhmm(S.horas[p.key])+'</b></div></div>'+
        (S.fotos[p.key]?'<p class="hint">📷 foto anexada</p>':'')+
        '<button type="button" class="btn btn-ok" data-act="prox">Próxima parada →</button>'+
        '<button type="button" class="mini" data-act="limpar">marquei errado, refazer</button></div>';
    } else {
      h += '<div class="resp">'+['S','NL','N'].map(function(c){
        return '<button type="button" data-act="res" data-r="'+c+'"><span class="gl">'+GLIFO[c]+'</span>'+NOME[c]+'</button>';
      }).join('')+'</div>';
    }

    h += '<button type="button" class="volta" data-act="lista">Ver todas as paradas</button>';
    if (!travado() && faltam()===0) {
      h += '<button type="button" class="btn btn-ok" data-act="conferir">FECHAR ORDEM E ENVIAR</button>';
    } else if (!travado()) {
      h += '<div class="painel"><p class="alerta">Faltam '+faltam()+' '+(faltam()===1?'coleta':'coletas')+' para encerrar esta Ordem</p></div>';
    }
    h += '<p class="foot">v'+VERSAO+'</p>';
    $('root').innerHTML=h;
  }

  function renderLista(){
    var h = topo() + '<h2 class="sec-h">Todas as paradas</h2><div class="lista">';
    paradas.forEach(function(p,i){
      var r=S.res[p.key], mot=S.motivo[p.key], ok=respondida(p);
      h += '<button type="button" class="lin'+(ok?' feita':'')+'" data-act="abrir" data-i="'+i+'">'+
        '<span class="num">'+pad(p.n)+'</span><span><span class="end">'+esc(p.e)+'</span><br>'+
        '<span class="st">'+(ok?GLIFO[r]+' '+NOME[r]+(mot?' - '+esc(mot):'')+(S.fotos[p.key]?' 📷':''):'— pendente')+'</span></span></button>';
    });
    h += '</div><button type="button" class="volta" data-act="voltar-foco">Voltar</button>';
    if (!travado() && faltam()===0) h += '<button type="button" class="btn btn-ok" data-act="conferir">FECHAR ORDEM E ENVIAR</button>';
    else if (!travado()) h += '<div class="painel"><p class="alerta">Faltam '+faltam()+' '+(faltam()===1?'coleta':'coletas')+' para encerrar esta Ordem</p></div>';
    $('root').innerHTML=h;
  }

  function renderConferir(){
    var c=contagem(), nf=comFoto().length;
    $('root').innerHTML = topo()+
      '<div class="painel"><h1>Confere antes de mandar</h1>'+
      '<div class="linhas">'+
        '<div><span>✓ Coletado</span><b>'+c.S+'</b></div>'+
        '<div><span>○ Nada no local</span><b>'+c.NL+'</b></div>'+
        '<div><span>✕ Não Coletado</span><b>'+c.N+'</b></div>'+
        (nf?'<div><span>📷 Fotos</span><b>'+nf+'</b></div>':'')+
      '</div>'+
      '<p class="alerta">Depois de enviar não dá pra mudar. Tem certeza?</p>'+
      '<button type="button" class="btn btn-ok" data-act="enviar">SIM, MANDAR</button>'+
      '<button type="button" class="volta" data-act="voltar-foco">Conferir de novo</button></div>';
  }

  function renderEnviado(){
    var nf=comFoto().length;
    $('root').innerHTML = topo()+
      '<div class="okbox"><div class="big">✓ ENVIADO</div>'+
      '<div>'+dataBR(S.enviado)+' às '+hhmm(S.enviado)+'</div></div>'+
      (nf ? '<div class="painel"><p class="hint">'+nf+' '+(nf===1?'foto':'fotos')+' desta ordem.</p>'+
            '<button type="button" class="btn btn-foto" data-act="mandar-fotos">Mandar '+(nf===1?'a foto':'as '+nf+' fotos')+'</button></div>' : '')+
      '<div class="painel"><button type="button" class="btn btn-ok" data-act="reenviar">Mandar o resumo de novo</button>'+
      '<button type="button" class="volta" data-act="lista">Ver todas as paradas</button>'+
      '<button type="button" class="mini" data-act="arquivo">arquivo para o sistema</button></div>'+
      '<p class="foot">v'+VERSAO+'</p>';
  }

  /* ---------- texto do resumo ---------- */
  function resumoTexto(){
    var L=[];
    L.push('ORDEM '+(O.ordem||'')+(O.frota?' · Frota '+O.frota:''));
    L.push('Fechada em '+dataBR(S.enviado||new Date().toISOString()));
    paradas.forEach(function(p){
      var r=S.res[p.key], mot=S.motivo[p.key], t=pad(p.n)+' ';
      if (r==='S') t+='Coletado';
      else if (r==='NL') t+='Coletado (nada no local)';
      else if (r==='N') t+='Não Coletado - '+(mot||'');
      else t+='SEM RESPOSTA';
      if (S.fotos[p.key]) t+=' [foto]';
      L.push(t);
    });
    return L.join('\n');
  }
  function arquivoJSON(){
    var linhas=[];
    paradas.forEach(function(p){
      var r=S.res[p.key]||'', base={ parada:p.n, e:p.e, r:r, folha:(r?(r==='N'?'N':'S'):''),
        motivo:r==='N'?(S.motivo[p.key]||''):'', t:S.horas[p.key]||'', foto:!!S.fotos[p.key] };
      if(!p.itens.length){ linhas.push(Object.assign({p:''},base)); return; }
      p.itens.forEach(function(i){ linhas.push(Object.assign({p:i.p},base)); });
    });
    var c=contagem();
    return { v:3, tipo:'ORDEM_FECHADA', app:'NUESTRO OPERADOR PWA '+VERSAO,
      ordem:O.ordem||'', emissao:O.emissao||'', frota:O.frota||'', elaborado:O.elaborado||'',
      bairro:O.bairro||'', cidade:O.cidade||'', enviado:S.enviado,
      resumo:{ paradas:paradas.length, coletado:c.S, nada_no_local:c.NL, nao_coletado:c.N },
      linhas:linhas, log:S.log };
  }

  /* ---------- saídas ---------- */
  function copiar(txt,ok){
    function fb(){ var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); toast(ok); }catch(e){ toast('Não consegui copiar.'); } ta.remove(); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){toast(ok);},fb);
    else fb();
  }
  function semSinal(){ return navigator.onLine === false; }
  function mandarTexto(){
    var txt = resumoTexto();
    if (semSinal()) toast('Sem sinal — a mensagem sai quando voltar.');
    if (navigator.share) {
      navigator.share({ text: txt }).then(function(){ toast('Resumo enviado.'); })
        .catch(function(e){ if(e&&e.name==='AbortError') return; copiar(txt,'Compartilhamento recusado. Resumo copiado — cole no WhatsApp.'); });
    } else copiar(txt,'Resumo copiado — cole no WhatsApp.');
  }
  function dataUrlParaFile(du,nome){
    var p=du.split(','), bin=atob(p[1]), n=bin.length, u=new Uint8Array(n);
    while(n--) u[n]=bin.charCodeAt(n);
    return new File([u],nome,{type:'image/jpeg'});
  }
  function mandarFotos(){
    var lista=comFoto();
    if(!lista.length){ toast('Nenhuma foto.'); return; }
    Promise.all(lista.map(function(p){
      return fotoLer(p.key).then(function(du){
        if(!du) return null;
        var prot=(p.itens[0]&&p.itens[0].p)||'';
        return dataUrlParaFile(du, (O.ordem||'ordem')+'_p'+pad(p.n)+(prot?'_'+prot:'')+'.jpg');
      });
    })).then(function(fs){
      fs=fs.filter(Boolean);
      if(!fs.length){ toast('Não encontrei as fotos.'); return; }
      if (navigator.canShare && navigator.canShare({files:fs}) && navigator.share) {
        navigator.share({files:fs}).then(function(){ toast('Fotos enviadas.'); })
          .catch(function(e){ if(e&&e.name==='AbortError') return; baixarFotos(fs); });
      } else baixarFotos(fs);
    });
  }
  function baixarFotos(fs){
    fs.forEach(function(f,i){
      setTimeout(function(){
        var u=URL.createObjectURL(f), a=document.createElement('a');
        a.href=u; a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){URL.revokeObjectURL(u);},4000);
      }, i*400);
    });
    toast('Fotos baixadas — mande pelo WhatsApp.');
  }
  function baixarArquivo(){
    try{
      var u=URL.createObjectURL(new Blob([JSON.stringify(arquivoJSON(),null,1)],{type:'application/json'}));
      var a=document.createElement('a'); a.href=u;
      a.download='ORDEM_FECHADA_'+String(O.ordem||'ordem').replace(/[^\w.-]/g,'_')+'.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){URL.revokeObjectURL(u);},5000);
      toast('Arquivo em Downloads.');
    }catch(e){ toast('Não consegui baixar.'); }
  }

  /* ---------- foto: reduz e carimba ---------- */
  function processarFoto(file, p){
    return new Promise(function(ok,err){
      var fr=new FileReader();
      fr.onload=function(){
        var img=new Image();
        img.onload=function(){
          var max=1280, esc2=Math.min(1,max/Math.max(img.width,img.height));
          var w=Math.round(img.width*esc2), hh=Math.round(img.height*esc2);
          var faixa=Math.max(54, Math.round(hh*0.14));
          var cv=document.createElement('canvas'); cv.width=w; cv.height=hh+faixa;
          var cx=cv.getContext('2d');
          cx.drawImage(img,0,0,w,hh);
          cx.fillStyle='#000'; cx.fillRect(0,hh,w,faixa);
          var prot=p.itens.map(function(i){return i.p;}).join(' ');
          var l1=(O.ordem||'')+' · Parada '+pad(p.n)+(prot?' · '+prot:'');
          var l2=p.e;
          var d=new Date(); var l3=dataBR(d.toISOString())+' '+pad(d.getHours())+':'+pad(d.getMinutes());
          var fs=Math.round(faixa*0.26);
          cx.fillStyle='#fff'; cx.textBaseline='top';
          cx.font='bold '+fs+'px sans-serif'; cx.fillText(l1, 12, hh+faixa*0.08);
          cx.font=fs*0.92+'px sans-serif';   cx.fillText(l2, 12, hh+faixa*0.40);
          cx.font=fs*0.82+'px sans-serif';   cx.fillText(l3, 12, hh+faixa*0.70);
          ok(cv.toDataURL('image/jpeg',0.72));
        };
        img.onerror=function(){ err(new Error('imagem inválida')); };
        img.src=fr.result;
      };
      fr.onerror=function(){ err(new Error('não consegui ler a foto')); };
      fr.readAsDataURL(file);
    });
  }

  /* ---------- ações ---------- */
  function irPara(i){ S.foco=Math.max(0,Math.min(paradas.length-1,i)); S.view='foco'; save(); render(); window.scrollTo(0,0); }
  function proxima(){
    var i=indicePendente();
    if (faltam()===0) { S.view='conferir'; save(); render(); window.scrollTo(0,0); return; }
    irPara(i);
  }
  function marcar(r){
    var p=paradas[S.foco];
    if (travado()) return;
    S.res[p.key]=r; S.horas[p.key]=new Date().toISOString();
    if (r!=='N') delete S.motivo[p.key];
    if (S.saiuPara===p.key){ S.saiuPara=null; }
    if (S.aviso && S.aviso.key===p.key) S.aviso=null;
    logar('Parada '+p.n+' · '+NOME[r]+' — '+p.e);
    save();
    if (r==='N') { render(); window.scrollTo(0,0); }
    else proxima();
  }
  function escolherMotivo(m){
    var p=paradas[S.foco];
    S.motivo[p.key]=m; logar('Parada '+p.n+' · motivo: '+m); save();
    if (m===COM_FOTO) { S.pendenteFoto=true; S.previa=null; render(); window.scrollTo(0,0); }
    else proxima();
  }
  function limpar(){
    var p=paradas[S.foco];
    if (travado()) return;
    delete S.res[p.key]; delete S.motivo[p.key]; delete S.horas[p.key];
    S.pendenteFoto=false; S.previa=null;
    logar('Parada '+p.n+' · refeita'); save(); render(); window.scrollTo(0,0);
  }
  function enviar(){
    S.enviado=new Date().toISOString();
    logar('Ordem enviada');
    S.view='enviado'; save(); render(); window.scrollTo(0,0);
    setTimeout(mandarTexto, 120);
  }

  document.addEventListener('click', function(ev){
    var t=ev.target.closest?ev.target.closest('[data-act]'):null; if(!t) return;
    var a=t.getAttribute('data-act');
    if (a==='maps'){ var p=paradas[S.foco]; S.saiuPara=p.key; S.saiuEm=new Date().toISOString();
      logar('Abriu o mapa da parada '+p.n); save(); return; }     /* deixa o link abrir */
    ev.preventDefault();
    if (a==='res') marcar(t.getAttribute('data-r'));
    else if (a==='motivo') escolherMotivo(t.getAttribute('data-m'));
    else if (a==='limpar') limpar();
    else if (a==='prox') proxima();
    else if (a==='lista'){ S.view='lista'; save(); render(); window.scrollTo(0,0); }
    else if (a==='voltar-foco'){ S.view = S.enviado?'enviado':'foco'; save(); render(); window.scrollTo(0,0); }
    else if (a==='ver-enviado'){ S.view='enviado'; save(); render(); window.scrollTo(0,0); }
    else if (a==='abrir'){ if(travado()){ toast('Ordem enviada, não dá pra mudar.'); return; } irPara(parseInt(t.getAttribute('data-i'),10)); }
    else if (a==='conferir'){ S.view='conferir'; save(); render(); window.scrollTo(0,0); }
    else if (a==='enviar') enviar();
    else if (a==='reenviar') mandarTexto();
    else if (a==='mandar-fotos') mandarFotos();
    else if (a==='arquivo') baixarArquivo();
    else if (a==='ir-aviso'){ var k=S.aviso&&S.aviso.key; S.aviso=null;
      var idx=paradas.map(function(x){return x.key;}).indexOf(k); save(); irPara(idx<0?S.foco:idx); }
    else if (a==='foto'){ $('cam').click(); }
    else if (a==='foto-ok'){ S.pendenteFoto=false; S.previa=null; save(); proxima(); }
  });

  $('cam').addEventListener('change', function(){
    var f=this.files&&this.files[0]; if(!f) return;
    var p=paradas[S.foco];
    toast('Preparando a foto...');
    processarFoto(f,p).then(function(du){
      return fotoSalvar(p.key,du).then(function(){
        S.fotos[p.key]=true; S.previa=du; logar('Foto da parada '+p.n); save(); render(); window.scrollTo(0,0);
      });
    }).catch(function(e){ toast(e.message||'Não consegui usar a foto.'); });
    this.value='';
  });

  /* volta do Maps */
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState!=='visible' || !S.saiuPara) return;
    var k=S.saiuPara, p=paradas.filter(function(x){return x.key===k;})[0];
    if (!p) { S.saiuPara=null; return; }
    var idx=paradas.indexOf(p);
    if (respondida(p)) { S.saiuPara=null; save(); return; }
    if (S.foco===idx) { S.aviso=null; S.saiuPara=null; save(); render(); return; }
    S.aviso={ key:k, n:p.n, e:p.e }; S.saiuPara=null; save(); render(); window.scrollTo(0,0);
  });

  /* ---------- arranque ---------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
  var frag=location.hash||'';
  function abrir(ord){
    var tem=(ord && ((ord.paradas&&ord.paradas.length)||(ord.itens&&ord.itens.length)));
    if(!tem) throw new Error('ordem vazia');
    if (ord.validade){ var lim=new Date(ord.validade+'T23:59:59');
      if(!isNaN(lim) && new Date()>lim){ telaInicial('Esta ordem venceu em '+ord.validade+'. Peça ao operador um link novo.'); return; } }
    try{ localStorage.setItem('nuestro-operador:ultima', JSON.stringify(ord)); }catch(e){}
    montar(ord); render();
  }
  if (!frag || frag.length<3) {
    var u=null; try{ u=localStorage.getItem('nuestro-operador:ultima'); }catch(e){}
    if(u){ try{ abrir(JSON.parse(u)); }catch(e){ telaInicial(); } } else telaInicial();
  } else {
    window.OrdemCodec.decode(frag).then(abrir).catch(function(e){ telaInicial(e&&e.message?e.message:'Link inválido.'); });
  }
})();
</script>
</body>
</html>
